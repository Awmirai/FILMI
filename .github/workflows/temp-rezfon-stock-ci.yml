name: Temporary Rezfon Stock CI
on:
  pull_request:
    branches: [ Tech_VJ ]

jobs:
  rezfon-stock:
    if: github.head_ref == 'rezfon-stock-ci-20260927'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: rezfon-stock-prototype
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rezfon-stock-apk
          path: rezfon-stock-prototype/app/build/outputs/apk/debug/app-debug.apk
